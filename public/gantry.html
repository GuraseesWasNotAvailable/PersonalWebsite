<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecting to Gantry…</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #efeee9;
        font-family: 'Helvetica Neue ME', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        text-align: center;
        padding: 2rem;
      }
      .label {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(239, 238, 233, 0.5);
        margin: 0 0 0.75rem;
      }
      .name {
        font-size: clamp(2.5rem, 9vw, 5rem);
        line-height: 1;
        margin: 0 0 1.25rem;
      }
      .msg {
        font-size: 0.95rem;
        color: rgba(239, 238, 233, 0.7);
        margin: 0 0 1.75rem;
      }
      a.cta {
        color: #efeee9;
        text-decoration: none;
        border-bottom: 1px solid #efeee9;
        padding-bottom: 2px;
        transition: opacity 0.3s ease;
      }
      a.cta:hover {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="label">Gantry</p>
      <h1 class="name">Gurasees Dhanoa</h1>
      <p class="msg">Taking you to the live build&hellip;</p>
      <!-- ============================================================= -->
      <!-- SINGLE SOURCE OF TRUTH for the Gantry target.                  -->
      <!-- Stable hostname, served by Caddy on the eval box. Survives     -->
      <!-- reboots. Only change this if the box moves.                    -->
      <!-- ============================================================= -->
      <a class="cta" id="target" href="https://gantry.gurasees.com"
        >Continue &rarr;</a
      >
    </div>
    <script>
      // Read the destination from the link above (one source of truth)
      // and forward immediately. If JS is off, the visible link still works.
      var url = document.getElementById('target').href;
      window.location.replace(url);
    </script>
  </body>
</html>
